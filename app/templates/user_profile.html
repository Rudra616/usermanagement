{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>
    <link rel="stylesheet" href="{% static 'css/reg_user.css' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">

</head>
<body> 
      <div class="container"> 
        <div class="row">
          <div class="col">
            <h2>Welcome, {{ username.FirstName }} {{ username.LastName }}</h2>
          </div>
        </div>  
        <div class="row">
          <div class="col">
            {% if success %}
                <p style="color: green;">{{ success }}</p>
            {% endif %}
            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}
          </div>  
        </div>    

            <form method="POST" action="{% url 'update_profile' %}"  onsubmit="return isFormValid()" enctype="multipart/form-data">
                {% csrf_token %}
            
        <div class="row">
            <div class="col">
                <label>First Name:</label>
                <input type="text" name="FirstName" class="form-control" value="{{ username.FirstName }}" id="FirstName" oninput="onlyAcceptAlphabets(this)" oninput="onlyAcceptAlphabets(this)" >
                <small class="error"></small>
            </div> 
            <div class="col">    
                <label>Last Name:</label>
                <input type="text" name="LastName" class="form-control" value="{{ username.LastName }}" id="LastName" oninput="onlyAcceptAlphabets(this)" >
                <small class="error"></small>
            </div>   
        </div>    

        
        <div class="row">
            <div class="col">
                <label>Username:</label>
                <input type="text" name="username" class="form-control" value="{{ username.username }}"  id="username" >
                        <small class="error"></small>
            </div>    
            <div class="col">
                <label>password:</label>
                <input type="text" name="password" class="form-control" value="{{ username.password }}" id="password" >
                        <small class="error"></small>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label>Email:</label>
                <input type="email" name="email" class="form-control" value="{{ username.email }}" id="email" >
                        <small class="error"></small>
            </div>
        </div>    
                
        <div class="row">
            <div class="col">
                <label>number:</label>
                <input type="number" name="number" class="form-control" value="{{ username.phonenumber }}" id="number" >
                     <small class="error"></small>
            </div>
            <div class="col">
                <label>Address:</label>
                <input type="text" name="address" class="form-control" value="{{ username.address }}" id="address" >
                        <small class="error"></small>
            </div>
        </div>
                
        <div class="row">
            <div class="col">
                <label for="state">State</label>
                <select id="state" name="state" class="form-select">
                    {% if username.state %}
                        <option value="{{ username.state }}" selected>{{ username.state }}</option>
                    {% else %}
                        <option value="" selected>Select state</option>
                    {% endif %}
                    <option value="Gujarat">Gujarat</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Rajasthan">Rajasthan</option>
                </select>
                        <small class="error"></small>
            </div>    

            <div class="col">
                <label for="district">District</label>
                <select id="district" name="district" class="form-select" >
                    {% if username.district %}
                        <option value="{{ username.district }}" selected>{{ username.district }}</option>
                    {% else %}
                        <option value="" selected>Select district</option>
                    {% endif %}
                </select>
                        <small class="error"></small>
            </div>    
        </div>    

        <div class="row">
            <div class="col">
                
            {% if username.image %}
                <img src="{{ username.image.url }}" alt="User Image" width="100px">
            {% endif %}
                
                    <label class="form-label">upload Image (Optional)</label>
                    <input class="form-control" type="file" name="image">
            </div>
        </div>    
        <div class="row">
            <div class="col" id="button">
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </div>
        </div>    
      </div>

            </form>
        
            
                <script src="{% static "js/reg.js" %}"></script>
                <script>
        // {% comment %} window.onload = function() {
        //     {% if success %}
        //         alert("{{ success }}");
        //     {% endif %}
    
        //     {% if error %}
        //         alert("{{ error }}");
        //     {% endif %}
        // }; {% endcomment %}
        </script>
</body>
</html>
