{% extends "nav.html" %}
{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
    .pagination a {
        margin: 0 5px;
        text-decoration: none;
        color: #007bff;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block body %}
<h2 class="p">Welcome Admin: {{ userdetails.username }}</h2>
<h3>All Users</h3>

<div class="main">
    <form id="filterForm" method="get">
        <input type="text" name="search" id="searchInput" placeholder="Search username">
        <button type="submit">Search</button>
        <select name="per_page" id="perPageSelect">
            <option value="10">10</option>
            <option value="35">35</option>
            <option value="50">50</option>
            <option value="all">All</option>
        </select>
    </form>

    <div id="userTableSection"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function fetchUsers(params = {}) {
    const queryString = new URLSearchParams(params).toString();
    const newUrl = window.location.pathname + '?' + queryString;
    window.history.pushState({}, '', newUrl);

    $.ajax({
        url: "{% url 'admin_dashbord' %}",
        data: params,
        type: 'GET',
        headers: { "X-Requested-With": "XMLHttpRequest" },
        success: function(data) {
            renderTable(data.users);
            renderPagination(data.pagination);
            if (data.search_count !== null) {
                $('#userTableSection').prepend(
                    `<p><b>${data.search_count}</b> users found for "<b>${$('#searchInput').val()}</b>"</p>`
                );
            }
            if (data.matched_page) {
                $('#userTableSection').prepend(
                    `<div class="alert alert-info mt-2">
                        User found on page <strong>${data.matched_page}</strong>.
                    </div>`
                );
            }
        }
    });
}

function renderTable(users) {
    let html = '<table class="table table-dark table-striped"><tr>';
    html += '<th>ID</th><th>First Name</th><th>Last Name</th><th>Username</th><th>Email</th><th>Address</th><th>District</th><th>State</th><th>Date of Birth</th><th>Actions</th></tr>';

    if (users.length === 0) {
        html += '<tr><td colspan="10">No users found.</td></tr>';
    } else {
        users.forEach(user => {
            html += `<tr>
                <td>${user.id}</td>
                <td>${user.first_name}</td>
                <td>${user.last_name}</td>
                <td>${user.username}</td>
                <td>${user.email}</td>
                <td>${user.address}</td>
                <td>${user.district}</td>
                <td>${user.state}</td>
                <td>${user.date_of_birth}</td>
                <td>
                    <a href="/delete_user/${user.id}/" onclick="return confirm('Are you sure you want to delete ${user.username}?');">Delete</a>
                </td>
            </tr>`;
        });
    }

    html += '</table>';
    $('#userTableSection').html(html);
}

function renderPagination(pagination) {
    let html = '<div class="pagination">';
    if (pagination.has_previous) {
        html += `<a href="#" class="pagelink" data-page="${pagination.current_page - 1}">Previous</a>`;
    }
    html += `<span>Page ${pagination.current_page} of ${pagination.total_pages}</span>`;
    if (pagination.has_next) {
        html += `<a href="#" class="pagelink" data-page="${pagination.current_page + 1}">Next</a>`;
    }
    html += '</div>';
    $('#userTableSection').append(html);
}

$("#filterForm").on('submit', function(e) {
    e.preventDefault();
    const search = $("#searchInput").val();
    const per_page = $("#perPageSelect").val();
    fetchUsers({ search: search, per_page: per_page, page: 1 });
});

$('#perPageSelect').on('change', function () {
    const search = $('#searchInput').val();
    const per_page = $('#perPageSelect').val();
    fetchUsers({ search: search, per_page: per_page, page: 1 });
});

$(document).on('click', '.pagelink', function(e) {
    e.preventDefault();
    const page = $(this).data('page');
    const search = $('#searchInput').val();
    const per_page = $('#perPageSelect').val();
    fetchUsers({ page: page, search: search, per_page: per_page });
});

$(document).ready(function() {
    fetchUsers(); // Load data initially
});
</script>
{% endblock %}
