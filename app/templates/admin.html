{% extends "nav.html" %}
{% block css %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        
    </style>
    {% endblock %}


{% block body %}

        <h2 class="p">Welcome Admin: {{ userdetails.username }}</h2>
        <h3>All Users</h3>
    <div class="main">
        <form id="filterForm" method="get">
     
        <input type="text" name="search" id="searchInput"  placeholder="Search username" value="{{ search_query }}">
        <button type="submit">Search</button>

  {% comment %} <select name="per_page"  onchange="this.form.submit()"> {% endcomment %}
    <select name="per_page" id="perPageSelect">

    <!--when user select then autometicaly submit the form-->
    <option value="10" {% if per_page == "10" %}selected{% endif %}>10</option>
    <option value="35" {% if per_page == "35" %}selected{% endif %}>35</option>
    <option value="50" {% if per_page == "50" %}selected{% endif %}>50</option>
    <option value="all" {% if per_page == "all" %}selected{% endif %}>All</option>
  </select>    
</form>

    <div id="userTableSection">

        {% include "user_table.html" %}
  </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    function fetchUsers(params={}){
        $.ajax({
            url: "{% url 'admin_dashbord' %}",
            data: params,             // These are the parameters (search, per_page, page)
            type :'GET',
            success:function(data){
                $('#userTableSection').html(data.html);
            }
        });
    }
     // Step 2: When the search form is submitted
    $("#filterForm").on('submit',function(e){
        e.preventDefault();

        const search = $("#searchInput").val()
        const per_page =$("#perPageSelect").val()

        fetchUsers({search :search,per_page:per_page});

    })

    $('#perPageSelect').on('change', function () {
        $('#filterForm').submit(); 
    });


    $(document).on('click','.pagelink',function(e){
        e.preventDefault()
        const page = $(this).data('page'); 
        const search = $('#searchInput').val();
        const per_page = $('#perPageSelect').val();
        fetchUsers({ page: page, search: search, per_page: per_page }); // Load new page via AJAX

    })


</script>

{%endblock%}
