{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <div class="card">
        <h2 class="title">Login Form</h2>
        <form method="POST" enctype="multipart/form-data" onsubmit="return required()">
            {% csrf_token %}
            <div class="input-group">
                <label for="FirstName">First Name</label>
                <input class="input--style-4" type="text" name="FirstName" id="FirstName" oninput="characters(this)">
            </div>
            <div class="input-group">
                <label for="LastName">Last Name</label>
                <input class="input--style-4" type="text" name="LastName" id="LastName" oninput="characters(this)">
            </div>
            <div class="input-group">
                <label for="userName">User Name</label>
                <input class="input--style-4" type="text" name="username" id="username" >
            </div>
         
            <div class="input-group">
                <label for="password">Password</label>
                <input class="input--style-4" type="password" name="password" id="password" >
            </div>
            
            <div class="input-group">
                <label for="email">Email</label>
                <input class="input--style-4" type="email" name="email" id="email">
            </div>
            <div class="input-group">
                <label for="email">number</label>
                <input class="input--style-4" type="number" name="number" id="number">
            </div>
            <div class="input-group">
                <label for="email">address</label>
                <input class="input--style-4" type="text" name="address" id="address" >
            </div>
            <div class="input-group">
                <label for="email">state</label>
                <select id="state" name="state" >
                    <option value="">select state</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Rajasthan">Rajasthan</option>
                </select>
            </div>
            <div class="input-group">
                <label for="district">district</label>
                <select id="district" name="district" >
                    <option value="">-- select district --</option>
                </select>
            </div>


              <div class="mb-3">
                <label class="form-label">upload Image (Optional)</label>
                <input class="form-control" type="file" name="image">
            </div>

            <div class="input-group">
                <button class="btn" type="submit">Submit</button>
            </div>
        </form>
        <div class="text-center">
            <a>Login</a>
        </div>
    </div>
    <script src="{% static 'js/reg.js' %}"></script>
        <script>
        window.onload = function() {
            {% if success %}
                alert("{{ success }}");
            {% endif %}
    
            {% if error %}
                alert("{{ error }}");
            {% endif %}
        };
        </script>


</body>
</html>
