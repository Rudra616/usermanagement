{% extends "nav.html" %}

{% load static %}

    {% block css %}
    <link rel="stylesheet" href="{% static 'css/reg_user.css' %}" />
    {%endblock%}
 
      {% block title %}register{%endblock%}
      {% block body %}
        <div class="title_center">
        <h3 class="title">Register Form</h3>
        </div>

     
        <!--
         // check is message avaible in session
         if( session('reg_message')  ) {
         <div class="alert alert-primary" role="alert">
          A simple primary alert—check it out!
        </div>
         // clear message in session
        } 
        
        -->
        {% comment %} <form
          method="POST"
          enctype="multipart/form-data"
          onsubmit="return isFormValid()"
        > {% endcomment %}

<form
  id="registerForm"
  method="POST"
  enctype="multipart/form-data"
  onsubmit="return isFormValid()"
>          {% csrf_token %}

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="FirstName"  class="form-label" >First Name*</label>
                    <input
                      type="text"
                      class="form-control"
                      name="FirstName"
                      id="FirstName"
                      oninput="onlyAcceptAlphabets(this)"
                      maxlength="15"
                    />
                    <small class="error"></small>
                  </div>                
                  <div class="col-md-6">
                    <label for="LastName"  class="form-label" >Last Name*</label>
                    <input
                      type="text"
                      class="form-control"
                      name="LastName"
                      id="LastName"
                      oninput="onlyAcceptAlphabets(this)"
                      maxlength="18"
                    />
                    <small class="error"></small>
                  </div>
                </div>
              
            
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="username" class="form-label" >User Name*</label>
                    <input
                      type="text"
                      name="username"
                      class="form-control"
                      id="username"
                      maxlength="10"
                    />
                    <small class="error"></small>
                  </div>
                
                  <div class="col-md-6">
                    <label for="password"  class="form-label" >Password*</label>
                    <input
                      type="password"
                      name="password"
                      class="form-control"
                      id="password"
                      maxlength="10"
                      minlength="6"
                    />
                    <small class="error"></small>
                  </div>
                </div>        
                <div class="row g-3">  
                  <div class="col-md-6">
                    <label for="number"  class="form-label" >Number*</label>
                    <input type="number" name="number" id="number"  maxlength="10" class="form-control" />
                    <small class="error"></small>
                  </div>

                
                  <div class="col-md-6">
                    <label for="email"  class="form-label" >Email*</label>
                    <input type="email" name="email" id="email" class="form-control" maxlength="50" />
                    <small class="error"></small>
                  </div>
                
                </div>    
                  <div class="col-12">
                    <label for="address"  class="form-label" >Address*</label>
                    <input type="text" name="address" id="address" class="form-control" maxlength="100" />
                    <small class="error"></small>
                  
                  </div>

                <div class="row g-3">  
                  
                  <div class="col-md-6">
                    
 <label for="state"  class="form-label" >State*</label>
                    <select id="state" name="state" class="form-control">
                      <option value="">Select state</option>
                      <option value="Gujarat">Gujarat</option>
                      <option value="Maharashtra">Maharashtra</option>
                      <option value="Rajasthan">Rajasthan</option>
                    </select>
                    <small class="error"></small>
                  </div>
                  <div class="col-md-6">
                    <label for="district"  class="form-label" >District*</label>
                    <select id="district" name="district" class="form-control">
                      <option value="">-- Select District --</option>
                    </select>
                    <small class="error"></small>
                  </div>               </div>
                 
              
                
                  <div class="mb-3">
                    <label for="formFile" class="form-label">upload image  (Optional)</label>
                    <input class="form-control" type="file" name="image" id="formFile">
                  </div>
            
              <div class="submit-center">    
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>           
        </form>


    <script src="{% static 'js/reg.js' %}"></script>      <script>
var stateDistrictMap = {
  Gujarat: ["Ahmedabad", "Surat", "Rajkot"],
  Maharashtra: ["Mumbai", "Pune", "Nagpur"],
  Rajasthan: ["Jaipur", "Udaipur", "Jodhpur"],
};

var stateDropdown = document.getElementById("state");
var districtDropdown = document.getElementById("district");

stateDropdown.onchange = function () {
  var selectedState = stateDropdown.value;
  var districts = stateDistrictMap[selectedState];

  districtDropdown.innerHTML = "";

  var defaultOption = document.createElement("option");
  defaultOption.text = "-- Select District --";
  defaultOption.value = "";
  districtDropdown.add(defaultOption);

  if (districts) {
    for (var i = 0; i < districts.length; i++) {
      var option = document.createElement("option");
      option.text = districts[i];
      option.value = districts[i];
      districtDropdown.add(option);
    }
  }
};

function isFormValid() {
  var errors = document.querySelectorAll("[class='error']");
  var FirstName = document.getElementById("FirstName").value;
  var LastName = document.getElementById("LastName").value;
  var username = document.getElementById("username").value;
  var password = document.getElementById("password").value;
  var number = document.getElementById("number").value;
  var email = document.getElementById("email").value;
  var address = document.getElementById("address").value;
  var state = document.getElementById("state").value;
  var district = document.getElementById("district").value;

  var all = [
    FirstName,
    LastName,
    username,
    password,
    number,
    email,
    address,
    state,
    district,
  ];
  var isValid = true;

  // Clear all error messages 
  errors.forEach((element, key) => {
    errors[key].innerText = '';
  }); 

  // Check for empty fields
  all.forEach((element, key) => {
    if (element === '') {
      errors[key].innerText = "This field is required";
      isValid = false;
    }
  });

  var cleanedNumber = number.replace(/[^0-9]/g, "");
  if (cleanedNumber.length !== 10) {
    errors[4].innerText = "Number must be exactly 10 digits";
    document.getElementById("number").focus();
    isValid = false;
  }

  return isValid;
}

function onlyAcceptAlphabets(input) {
  input.value = input.value.replace(/[^a-zA-Z]/g, "");
}

// ✅ AJAX Submit Logic
document.getElementById("registerForm").addEventListener("submit", function (e) {
  e.preventDefault();
//It stops the browser from reloading or submitting the form in the normal way.
//This gives you full control to:
//Validate the form manually
//Send the data using AJAX (fetch())
//Show success or error messages without reloading the page.

  if (!isFormValid()) return;

  const form = this;
  const formData = new FormData(form);

  const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

  fetch(form.action || window.location.href, {
    method: "POST",
    headers: {
      "X-CSRFToken": csrfToken,
      "X-Requested-With": "XMLHttpRequest"
    },
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    const alertBox = document.createElement("div");
    alertBox.classList.add("alert");
    alertBox.classList.add(data.status === "success" ? "alert-success" : "alert-error");
    alertBox.innerText = data.message;

    document.querySelectorAll(".alert").forEach(el => el.remove());
    form.insertAdjacentElement("beforebegin", alertBox);

    if (data.status === "success") {
      form.reset();
      districtDropdown.innerHTML = '<option value="">-- Select District --</option>';
    }
  })
  .catch(error => {
    console.error("Error:", error);
    alert("Something went wrong while submitting the form.");
  });
});
</script>

    </script>
  {%endblock%}
