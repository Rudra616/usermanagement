{% extends "nav.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/reg_user.css' %}" />
{% endblock %}

{% block title %}Register{% endblock %}

{% block body %}
<div class="title_center">
  <h3 class="title">Register Form</h3>
</div>

<form id="registerForm" method="POST" enctype="multipart/form-data" onsubmit="return isFormValid()">
  {% csrf_token %}

  <div class="row g-3">
    <div class="col-md-6">
      <label for="FirstName" class="form-label">First Name*</label>
      <input type="text" class="form-control" name="FirstName" id="FirstName" oninput="onlyAcceptAlphabets(this)" maxlength="15" />
      <small class="error"></small>
    </div>
    <div class="col-md-6">
      <label for="LastName" class="form-label">Last Name*</label>
      <input type="text" class="form-control" name="LastName" id="LastName" oninput="onlyAcceptAlphabets(this)" maxlength="18" />
      <small class="error"></small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="username" class="form-label">User Name*</label>
      <input type="text" name="username" class="form-control" id="username" maxlength="10" />
      <small class="error"></small>
    </div>

    <div class="col-md-6">
      <label for="password" class="form-label">Password*</label>
      <input type="password" name="password" class="form-control" id="password" maxlength="10" minlength="6" />
      <small class="error"></small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="number" class="form-label">Number*</label>
      <input type="number" name="number" id="number" maxlength="10" class="form-control" />
      <small class="error"></small>
    </div>

    <div class="col-md-6">
      <label for="email" class="form-label">Email*</label>
      <input type="email" name="email" id="email" class="form-control" maxlength="50" />
      <small class="error"></small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="date_of_birth" class="form-label">Date of Birth*</label>
      <input type="date" name="date_of_birth" id="date_of_birth" class="form-control" />
      <small class="error"></small>
    </div>
  </div>

  <div class="col-12">
    <label for="address" class="form-label">Address*</label>
    <input type="text" name="address" id="address" class="form-control" maxlength="100" />
    <small class="error"></small>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="state" class="form-label">State*</label>
      <select id="state" name="state" class="form-control">
        <option value="">-- Select State --</option>
        {% for s in states %}
          <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
      <small class="error"></small>
    </div>

    <div class="col-md-6">
      <label for="district" class="form-label">District*</label>
      <select id="district" name="district" class="form-control">
        <option value="">-- Select District --</option>
      </select>
      <small class="error"></small>
    </div>
  </div>

  <div class="mb-3">
    <label for="formFile" class="form-label">Upload Image (Optional)</label>
    <input class="form-control" type="file" name="image" id="formFile" />
  </div>

  <div class="submit-center">
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>

<script>
function onlyAcceptAlphabets(input) {
  input.value = input.value.replace(/[^a-zA-Z]/g, "");
}

function isFormValid() {
  var errors = document.querySelectorAll("small.error");
  var fields = [
    document.getElementById("FirstName").value,
    document.getElementById("LastName").value,
    document.getElementById("username").value,
    document.getElementById("password").value,
    document.getElementById("number").value,
    document.getElementById("email").value,
    document.getElementById("address").value,
    document.getElementById("state").value,
    document.getElementById("district").value,
  ];

  var isValid = true;

  errors.forEach((e, i) => e.innerText = "");

  fields.forEach((field, i) => {
    if (!field.trim()) {
      errors[i].innerText = "This field is required";
      isValid = false;
    }
  });

  const number = document.getElementById("number").value;
  if (number.length !== 10) {
    errors[4].innerText = "Number must be exactly 10 digits";
    isValid = false;
  }

  return isValid;
}

// 🔄 Fetch districts dynamically when state changes
document.getElementById("state").addEventListener("change", function () {
  const stateId = this.value;
  const districtDropdown = document.getElementById("district");

  districtDropdown.innerHTML = '<option value="">Loading...</option>';

  fetch(`/get-districts/?state_id=${stateId}`)
    .then(response => response.json())
    .then(data => {
      districtDropdown.innerHTML = '<option value="">-- Select District --</option>';
      data.forEach(d => {
        const option = document.createElement("option");
        option.value = d.id;
        option.text = d.name;
        districtDropdown.appendChild(option);
      });
    })
    .catch(error => {
      console.error('Error fetching districts:', error);
      districtDropdown.innerHTML = '<option value="">-- Error Loading --</option>';
    });
});

// ✅ AJAX form submit with validation
document.getElementById("registerForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const form = this;

  if (!isFormValid()) return;

  const formData = new FormData(form);
  const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;

  fetch(form.action || window.location.href, {
    method: "POST",
    headers: {
      "X-CSRFToken": csrfToken,
      "X-Requested-With": "XMLHttpRequest"
    },
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    document.querySelectorAll(".alert").forEach(el => el.remove());

    const alertBox = document.createElement("div");
    alertBox.classList.add("alert", data.success ? "alert-success" : "alert-danger");
    alertBox.innerText = data.message || data.error;

    form.insertAdjacentElement("beforebegin", alertBox);

    if (data.success) {
      form.reset();
      document.getElementById("district").innerHTML = '<option value="">-- Select District --</option>';
    }
  })
  .catch(error => {
    console.error("Error submitting form:", error);
    alert("An error occurred. Please try again.");
  });
});
</script>
{% endblock %}
