{% extends "nav.html" %}

{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Form</title>
    {% block css %}
    <link rel="stylesheet" href="{% static 'css/reg_user.css' %}" />
    {%endblock%}
 
      {% block title %}register{%endblock%}
      {% block body %}
        <div class="title_center">
        <h3 class="title">Register Form</h3>
        </div>

        {% if messages %} {% for message in messages %}
        <div
          class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %} {% endif %}

        <!--
         // check is message avaible in session
         if( session('reg_message')  ) {
         <div class="alert alert-primary" role="alert">
          A simple primary alert—check it out!
        </div>
         // clear message in session
        } 
        
        -->
        <form
          method="POST"
          enctype="multipart/form-data"
          onsubmit="return isFormValid()"
        >
          {% csrf_token %}

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="FirstName"  class="form-label" >First Name*</label>
                    <input
                      type="text"
                      class="form-control"
                      name="FirstName"
                      id="FirstName"
                      oninput="onlyAcceptAlphabets(this)"
                      maxlength="15"
                    />
                    <small class="error"></small>
                  </div>                
                  <div class="col-md-6">
                    <label for="LastName"  class="form-label" >Last Name*</label>
                    <input
                      type="text"
                      class="form-control"
                      name="LastName"
                      id="LastName"
                      oninput="onlyAcceptAlphabets(this)"
                      maxlength="18"
                    />
                    <small class="error"></small>
                  </div>
                </div>
              
            
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="username" class="form-label" >User Name*</label>
                    <input
                      type="text"
                      name="username"
                      class="form-control"
                      id="username"
                      maxlength="10"
                    />
                    <small class="error"></small>
                  </div>
                
                  <div class="col-md-6">
                    <label for="password"  class="form-label" >Password*</label>
                    <input
                      type="password"
                      name="password"
                      class="form-control"
                      id="password"
                      maxlength="10"
                      minlength="6"
                    />
                    <small class="error"></small>
                  </div>
                </div>        
                <div class="row g-3">  
                  <div class="col-md-6">
                    <label for="number"  class="form-label" >Number*</label>
                    <input type="number" name="number" id="number"  maxlength="10" class="form-control" />
                    <small class="error"></small>
                  </div>

                
                  <div class="col-md-6">
                    <label for="email"  class="form-label" >Email*</label>
                    <input type="email" name="email" id="email" class="form-control" maxlength="50" />
                    <small class="error"></small>
                  </div>
                
                </div>    
                  <div class="col-12">
                    <label for="address"  class="form-label" >Address*</label>
                    <input type="text" name="address" id="address" class="form-control" maxlength="100" />
                    <small class="error"></small>
                  
                  </div>

                <div class="row g-3">  
                  
                  <div class="col-md-6">
                    
 <label for="state"  class="form-label" >State*</label>
                    <select id="state" name="state" class="form-control">
                      <option value="">Select state</option>
                      <option value="Gujarat">Gujarat</option>
                      <option value="Maharashtra">Maharashtra</option>
                      <option value="Rajasthan">Rajasthan</option>
                    </select>
                    <small class="error"></small>
                  </div>
                  <div class="col-md-6">
                    <label for="district"  class="form-label" >District*</label>
                    <select id="district" name="district" class="form-control">
                      <option value="">-- Select District --</option>
                    </select>
                    <small class="error"></small>
                  </div>               </div>
                 
              
                
                  <div class="mb-3">
                    <label for="formFile" class="form-label">upload image  (Optional)</label>
                    <input class="form-control" type="file" name="image" id="formFile">
                  </div>
            
              <div class="submit-center">    
                <button type="submit" class="btn btn-primary">Submit</button>
              </div>           
        </form>


    <script src="{% static 'js/reg.js' %}"></script>
    <script>
      // window.onload = function () {
      //   {% if success %}
      //     alert("{{ success }}");
      //   {% endif %}
      //   {% if error %}
      //     alert("{{ error }}");
      //   {% endif %}
      // };
    </script>
  {%endblock%}
