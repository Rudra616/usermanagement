{% extends "nav.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/reg_user.css' %}" />
{% endblock css %}
{% block body %}
<div id="loader"></div>
<div class="title_center">
  <h3 class="title">Register Form</h3>
</div>

<form id="registerForm" method="POST" enctype="multipart/form-data" onsubmit="console.log(new FormData(this)); return isFormValid();">
  {% csrf_token %}

  <div class="row g-3">
    <div class="col-md-6">
      <label for="FirstName" class="form-label">First Name*</label>
      <input type="text" class="form-control" name="FirstName" id="FirstName" oninput="onlyAcceptAlphabets(this)" maxlength="15" />
      <small class="error"></small>
    </div>
    <div class="col-md-6">
      <label for="LastName" class="form-label">Last Name*</label>
      <input type="text" class="form-control" name="LastName" id="LastName" oninput="onlyAcceptAlphabets(this)" maxlength="18" />
      <small class="error"></small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="username" class="form-label">User Name*</label>
      <input type="text" name="username" class="form-control" id="username" maxlength="10" />
      <small class="error"></small>
    </div>

    <div class="col-md-6">
      <label for="password" class="form-label">Password*</label>
      <input type="password" name="password" class="form-control" id="password" maxlength="10" minlength="6" />
      <small class="error"></small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="number" class="form-label">Number*</label>
      <input type="number" name="number" id="number" maxlength="10" class="form-control" />
      <small class="error"></small>
    </div>

    <div class="col-md-6">
      <label for="email" class="form-label">Email*</label>
      <input type="email" name="email" id="email" class="form-control" maxlength="50" />
      <small class="error"></small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="date_of_birth" class="form-label">Date of Birth*</label>
      <input type="date" name="date_of_birth" id="date_of_birth" class="form-control" min="2008-01-01" max="2023-01-01" />
      <small class="error"></small>
    </div>
  </div>

  <div class="col-12">
    <label for="address" class="form-label">Address*</label>
    <input type="text" name="address" id="address" class="form-control" maxlength="100" />
    <small class="error"></small>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label for="state" class="form-label">State*</label>
      <select id="state" name="state" class="form-control">
        <option value="">-- Select State --</option>
        {% for s in states %}
          <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
      <small class="error"></small>
    </div>

    <div class="col-md-6">
      <label for="district" class="form-label">District*</label>
      <select id="district" name="district" class="form-control">
        <option value="">-- Select District --</option>
      </select>
      <small class="error"></small>
    </div>
  </div>

  <div class="mb-3">
    <label for="formFile" class="form-label">Upload Image (Optional)</label>
    <input class="form-control" type="file" name="image" id="formFile" />
  </div>

  <div class="submit-center">
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>

<script src="{% static 'js/reg.js' %}"> </script>
{% endblock %}
